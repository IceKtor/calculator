<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кельциев Виктор
    </title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1>Мой Калькулятор</h1>

    <div class="calculator">
<input type="text" id="display" disabled>
<div class="buttons">
    <button class="btn" data-value="1">1
    <button class="btn" data-value="2">2
    <button class="btn" data-value="3">3
    <button class="btnop" data-value="-">-
    <button class="btn" data-value="4">4
    <button class="btn" data-value="5">5
    <button class="btn" data-value="6">6
    <button class="btnop" data-value="+">+
    <button class="btn" data-value="7">7
    <button class="btn" data-value="8">8
    <button class="btn" data-value="9">9
    <button class="btnop" data-value="/">/
    <button class="btn" data-value="0">0
    <button class="btnc" data-value="C">C
    <button class="btncolor" data-value="=">=
    <button class="btnop" data-value="*">*
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
